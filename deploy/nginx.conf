server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 location = /health { access_log off; return 200 'ok'; }
 location = /config.js { add_header Cache-Control 'no-store'; }
 location = /mockServiceWorker.js { add_header Cache-Control 'no-store'; }
 location /assets/ { try_files $uri =404; }
 location / { add_header Cache-Control 'no-store'; try_files $uri /_shell.html; }
}
