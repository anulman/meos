name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate-contract.mjs --check
      - run: node --test scripts/backend-calendar-cache-tests.mjs scripts/backend-calendar-overlap-tests.mjs scripts/backend-calendar-polling-tests.mjs scripts/backend-http-tests.mjs scripts/backend-proxy-tests.mjs scripts/backend-tests.mjs
      - run: node scripts/calendar-window-benchmark.mjs
      - run: pnpm run licenses
      - run: pnpm build
      - run: pnpm typecheck
